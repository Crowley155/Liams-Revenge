<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section 8(d)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 2rem;
  }
  main {
    max-width: 540px;
    text-align: center;
  }
  blockquote {
    font-size: 1.25rem;
    line-height: 1.7;
    font-style: italic;
    color: #d4d4d4;
    border-left: 3px solid #555;
    padding-left: 1.5rem;
    text-align: left;
    margin-bottom: 2rem;
  }
  cite {
    display: block;
    font-size: 0.8rem;
    font-style: normal;
    color: #777;
    letter-spacing: 0.05em;
  }
  a {
    display: inline-block;
    margin-top: 2.5rem;
    font-size: 0.75rem;
    color: #888;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 0.2s;
  }
  a:hover { color: #bbb; }
</style>
</head>
<body>
<main>
  <blockquote>
    "Lessee will abide by&hellip; all rules, regulations, and policies adopted by the Board of Education of the School District&hellip;"
  </blockquote>
  <cite>USD 232 &ndash; JCPRD Lease Agreement, Section 8(d)</cite>
  <a href="https://www.ksrevisor.org/statutes/chapters/ch72/072_014_0021.html">K.S.A. 72-1421(c) &rarr;</a>
</main>
</body>
</html>
