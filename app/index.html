    <!-- JSON-LD: FAQPage — AEO gold. These are the questions people will ask. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What happened at Mize Elementary in USD 232?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "On April 2, 2026, a six-year-old was assaulted by a nine-year-old during a JCPRD-operated after-school program at Mize Elementary in the USD 232 school district. Five staff were outside. None witnessed the incident. The program's incident report concluded 'no medical treatment was necessary' — the child's pediatrician kept him home for a week and filed a DCF report as a mandatory reporter."
          }
        },
        {
          "@type": "Question",
          "name": "Is JCPRD responsible for child safety in USD 232 after-school programs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The lease agreement between USD 232 and JCPRD (Section 8d) requires JCPRD to follow all USD 232 board policies, rules, regulations, and standards. Kansas statute K.S.A. 72-1421(c) binds the district to the full KDHE childcare licensing chapter when they authorize a childcare facility on school property. Both entities share responsibility."
          }
        },
        {
          "@type": "Question",
          "name": "What is USDWatch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "USDWatch is a parent-built accountability platform documenting duty-of-care failures in USD 232's relationship with JCPRD. Every claim is grounded in publicly available records, statutes, and policies. The site presents sourced evidence, identifies non-compliance with existing policies, and proposes specific reforms."
          }
        },
        {
          "@type": "Question",
          "name": "What policies did USD 232 and JCPRD violate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Based on available records, multiple board policies were not followed: Policy KG (employee on duty when outside groups use the building), Policy JDDC (bullying prevention on school property), and Policy JDDB (mandatory reporting of assaults to law enforcement). KDHE childcare licensing regulations K.A.R. 28-4-437 requiring active supervision of children were also not met."
          }
        },
        {
          "@type": "Question",
          "name": "What reforms does USDWatch demand?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "USDWatch proposes reforms for both JCPRD and USD 232, including: affirming compliance with all board policies per the lease, enforcing age-appropriate grouping, active supervision standards per KDHE regulations, transparent incident reporting, and district oversight of third-party programs operating on school property."
          }
        }
      ]
    }
    </script>
