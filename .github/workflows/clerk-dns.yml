name: Configure Clerk DNS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clerk-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upsert Clerk CNAME records
        run: node scripts/upsert-clerk-dns.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: usdwatch.com
