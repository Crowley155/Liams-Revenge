name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build Astro site
        working-directory: app
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PUBLIC_CLERK_JWT_TEMPLATE: ${{ secrets.PUBLIC_CLERK_JWT_TEMPLATE }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy app/dist --project-name usdwatch --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_COMMIT_MESSAGE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event_name }}
