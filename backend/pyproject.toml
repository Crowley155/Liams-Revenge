[project]
name = "usdwatch-backend"
version = "0.1.0"
description = "Agentic research pipeline for public accountability"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "dspy>=2.6",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "qdrant-client>=1.13",
    "langfuse>=3.0",
    "openinference-instrumentation-dspy>=0.1",
    "redis>=5.0",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "bcrypt>=4.0",
    "agno[os]>=2.6.1",
    "litellm>=1.52.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
